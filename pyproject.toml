[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portpy-quant"
version = "0.2.0"
description = "Portfolio analysis, optimization, and management with built-in, human-readable explanations of every metric, chart, model, and strategy."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Arthur Lino Faugeron Jacono", email = "faugeronarthur@gmail.com" }
]
keywords = [
    "finance",
    "portfolio",
    "quant",
    "risk",
    "backtesting",
    "optimization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "statsmodels>=0.14"]

[project.optional-dependencies]
viz = ["plotly>=5.18", "matplotlib>=3.7", "seaborn>=0.13", "kaleido>=0.2.1"]
models = ["scikit-learn>=1.3", "arch>=6.3", "hmmlearn>=0.3.2"]
data = ["yfinance>=0.2.40", "alpaca-py>=0.30", "python-dotenv>=1.0"]
all = ["portpy-quant[viz,models,data]"]
dev = [
    "portpy-quant[all]",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "build>=1.0",
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "empyrical-reloaded>=0.5.7",
    "quantstats>=0.0.62",
    "PyPortfolioOpt>=1.5",
    "Riskfolio-Lib>=6.0",
    "skfolio>=1.2",
    "jupyter>=1.0",
    "nbformat>=5.9",
]

[project.urls]
Homepage = "https://github.com/Arthur-Faugeron/PortPy"
Documentation = "https://Arthur-Faugeron.github.io/PortPy/"
Repository = "https://github.com/Arthur-Faugeron/PortPy"
Issues = "https://github.com/Arthur-Faugeron/PortPy/issues"
Changelog = "https://github.com/Arthur-Faugeron/PortPy/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/portpy"]
include = ["src/portpy/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require downloading real market data (yfinance/Alpaca)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 (line-too-long) is disabled project-wide: PortPy's `Explanation` registry
# stores long, plain-English strings as the actual payload (not code), and
# wrapping prose to satisfy a code-formatting rule hurts readability more than
# it helps. Real code lines are still kept reasonable via `line-length` above.
ignore = ["E501"]

[tool.mypy]
# Pinned to the interpreter actually used for local/CI type-checking (3.12) to
# avoid a numpy stub parser issue on older targets; the package itself still
# declares `requires-python = ">=3.10"` and avoids any 3.11+/3.12-only syntax.
python_version = "3.12"
ignore_missing_imports = true

